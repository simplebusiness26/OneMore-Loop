name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - build-status.txt

permissions:
  contents: write

concurrency:
  group: one-more-loop-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        id: npm
        run: npm ci --no-audit --no-fund

      - name: Validate game and levels
        id: check
        run: npm run check

      - name: Build offline web bundle
        id: web
        run: |
          set -euxo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/game.js
          test -s dist/levels.js
          test -s dist/styles.css
          test -s dist/sw.js

      - name: Create Android project
        id: capadd
        run: npx cap add android

      - name: Sync web assets
        id: capsync
        run: npx cap sync android

      - name: Apply Android branding
        id: branding
        run: node scripts/android-brand.mjs

      - name: Prepare debug signing key
        id: signing
        env:
          STABLE_DEBUG_KEYSTORE_B64: ${{ secrets.ONE_MORE_LOOP_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "$STABLE_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$STABLE_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Simple Business,C=GB"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build debug APK
        id: gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        id: verify
        run: |
          set -euxo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk one-more-loop-debug.apk
          unzip -t one-more-loop-debug.apk
          sha256sum one-more-loop-debug.apk
          ls -lh one-more-loop-debug.apk

      - name: Upload workflow artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: one-more-loop-debug-apk
          path: one-more-loop-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest one-more-loop-debug.apk --clobber
            gh release edit android-latest --title "ONE MORE LOOP Android APK" --notes "Latest verified Android build of ONE MORE LOOP. Every push to main replaces this APK."
          else
            gh release create android-latest one-more-loop-debug.apk \
              --title "ONE MORE LOOP Android APK" \
              --notes "Latest verified Android build of ONE MORE LOOP. Every push to main replaces this APK."
          fi

      - name: Record build diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          JAVA: ${{ steps.java.outcome }}
          NPM: ${{ steps.npm.outcome }}
          CHECK: ${{ steps.check.outcome }}
          WEB: ${{ steps.web.outcome }}
          CAPADD: ${{ steps.capadd.outcome }}
          CAPSYNC: ${{ steps.capsync.outcome }}
          BRANDING: ${{ steps.branding.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > build-status.txt <<STATUS
          status=$JOB_STATUS
          commit=$COMMIT_SHA
          run_id=$RUN_ID
          checkout=$CHECKOUT
          setup_node=$NODE
          setup_java=$JAVA
          npm_install=$NPM
          validation=$CHECK
          prepare_web=$WEB
          capacitor_add_android=$CAPADD
          capacitor_sync=$CAPSYNC
          android_branding=$BRANDING
          debug_signing=$SIGNING
          gradle_build=$GRADLE
          verify_apk=$VERIFY
          upload_artifact=$ARTIFACT
          publish_release=$RELEASE
          STATUS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Android build status [skip ci]"
          git push
